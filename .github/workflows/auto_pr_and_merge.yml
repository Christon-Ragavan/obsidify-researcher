name: Auto PR and Merge

on:
  push:
    branches:
      - cn_notes/obsidian_session

jobs:
  auto-pr-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
          
      - name: Resolve conflicts (always accept incoming)
        run: |
          git config user.name "obsidify-ai-agent"
          git config user.email "ai-agent@obsidify.bot"
          git fetch origin
          git checkout cn_notes/obsidian_session
          git merge origin/main \
            --strategy-option=ours \
            --no-edit \
            --allow-unrelated-histories || true
          git push origin cn_notes/obsidian_session


      - name: Create PR if not exists
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          EXISTING=$(gh pr list --head cn_notes/obsidian_session --json number -q '.[0].number')

          if [ -z "$EXISTING" ]; then
            gh pr create \
              --title "Obsidian Session — $(date +'%Y-%m-%d')" \
              --body "Auto-generated from Obsidian sync." \
              --base main \
              --head cn_notes/obsidian_session
          else
            echo "PR #$EXISTING already exists"
          fi

      - name: Auto merge PR
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          PR_NUMBER=$(gh pr list --head cn_notes/obsidian_session --json number -q '.[0].number')
          gh pr merge $PR_NUMBER --squash --auto