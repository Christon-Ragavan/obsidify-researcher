name: Reset Session Branch After Merge

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  reset-branch:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'cn_notes/obsidian_session'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GH_PAT }}

      - name: Reset cn_notes/obsidian_session to main
        run: |
          git fetch origin
          git checkout main
          git pull origin main
          git branch -D cn_notes/obsidian_session 2>/dev/null || true
          git checkout -b cn_notes/obsidian_session
          git push origin cn_notes/obsidian_session --force
          echo "Branch reset to main successfully"